---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref: a new push cancels the previous run of the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner: repository variable RUNNER_LABELS, e.g. ["self-hosted","linux","x64"]; GitHub-hosted if unset.
# Fork PRs always run on GitHub-hosted runners (untrusted code must not reach the self-hosted one).
# The self-hosted image needs: uv, python3 (stdlib only, no pip/venv), curl, trivy (no Docker).
jobs:
  lint:
    timeout-minutes: 10
    # yamllint disable-line rule:line-length
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # The runner service has its own PATH: look for uv in the usual places
      - name: Ensure uv
        run: |
          for d in "$HOME/.local/bin" "$HOME/.cargo/bin" /usr/local/bin /opt/uv/bin; do
            [ -x "$d/uv" ] && echo "$d" >> "$GITHUB_PATH" && exit 0
          done
          command -v uv >/dev/null

      # terraform_fmt hook needs a terraform binary on PATH
      - name: Ensure terraform
        run: .ci/install-terraform.sh

      - name: Lint (strict, dummy secrets)
        run: uv run prek -a

      - name: start.sh syntax
        run: bash -n start.sh

  # Renders docker-compose.yml from the templates for each scenario in .ci/scenarios and validates it.
  # Catches template/YAML breakage that lint cannot see. Needs no secrets, starts no containers.
  render:
    name: render (${{ matrix.scenario }})
    timeout-minutes: 15
    # yamllint disable-line rule:line-length
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [quick, full]
    steps:
      - uses: actions/checkout@v7

      - name: Install Terraform
        run: .ci/install-terraform.sh

      - name: Render configs
        run: |
          make init
          set -a
          . ".ci/scenarios/${{ matrix.scenario }}.env"
          set +a
          make apply

      # no Docker on the runner: the standalone compose binary validates the file without a daemon
      - name: Validate docker-compose.yml
        run: |
          compose=$(.ci/install-compose.sh)
          "$compose" -f docker-compose.yml config -q

  commits:
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    # yamllint disable-line rule:line-length
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure uv
        run: |
          for d in "$HOME/.local/bin" "$HOME/.cargo/bin" /usr/local/bin /opt/uv/bin; do
            [ -x "$d/uv" ] && echo "$d" >> "$GITHUB_PATH" && exit 0
          done
          command -v uv >/dev/null

      - name: Conventional commits
        run: uvx --from commitizen cz check --rev-range "origin/${{ github.base_ref }}..HEAD"

      # with squash merge the PR title becomes the commit on main
      - name: PR title is a conventional commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uvx --from commitizen cz check --message "$PR_TITLE"
